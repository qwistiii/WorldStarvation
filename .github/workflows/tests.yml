name: tests
# Every pull request and every push to main: unit tests, the world generator tests and the browser scenario
# (desktop 1920x1080 and phone 390x844). The frame budget is not checked here — the CI machine has no GPU.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: unit tests
        run: npm run test:unit
      - name: world generator tests
        run: npm run test:legacy
      - name: browser scenario
        run: node tests/e2e/run.mjs --no-perf
      - name: build the single-file version
        run: npm run build
      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .work/e2e/
          if-no-files-found: ignore
