<script>
function WorldGen(SEED){
'use strict';
const M=Math,PI=M.PI,TAU=PI*2,WORLD=131072,TS=256;
const SUNX=0.62,SUNY=0.48;            // shadow offset per metre of height
const WDX=0.86,WDY=-0.51;             // wind direction
const ELEV=2600;                      // metres per height unit
function clamp(x,a,b){return x<a?a:x>b?b:x}
function smooth(e0,e1,x){let t=(x-e0)/(e1-e0);t=t<0?0:t>1?1:t;return t*t*(3-2*t)}
function lerp(a,b,t){return a+(b-a)*t}
function mix32(a){a=M.imul(a^(a>>>16),0x7feb352d);a=M.imul(a^(a>>>15),0x846ca68b);return (a^(a>>>16))>>>0}
const SS=mix32(M.imul(SEED|0,0x9E3779B1)+12345);
function hh(a,b,c){return mix32(M.imul(a|0,0x27d4eb2d)^mix32(M.imul(b|0,0x165667b1)^mix32(M.imul(c|0,0x1b873593)^SS)))}
function hr(a,b,c){return hh(a,b,c)/4294967296}
function rng(s){let a=s>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=M.imul(a^(a>>>15),1|a);t=(t+M.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296}}
function mkCanvas(w,h){if(typeof OffscreenCanvas!=='undefined')return new OffscreenCanvas(w,h);const c=document.createElement('canvas');c.width=w;c.height=h;return c}

// ---------------------------------------------------------------- noise
const P=new Uint8Array(512),GX=new Float32Array(256),GY=new Float32Array(256);
{const R=rng(SS^0xabcdef);const p=new Uint8Array(256);for(let i=0;i<256;i++)p[i]=i;
 for(let i=255;i>0;i--){const j=(R()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t}
 for(let i=0;i<512;i++)P[i]=p[i&255];for(let i=0;i<256;i++){const a=R()*TAU;GX[i]=M.cos(a);GY[i]=M.sin(a)}}
function noise(x,y){
  let xi=M.floor(x),yi=M.floor(y);const xf=x-xi,yf=y-yi;xi&=255;yi&=255;
  const u=xf*xf*xf*(xf*(xf*6-15)+10),v=yf*yf*yf*(yf*(yf*6-15)+10);
  const a=P[xi]+yi,b=P[xi+1]+yi;const g00=P[a],g01=P[a+1],g10=P[b],g11=P[b+1];
  const n00=GX[g00]*xf+GY[g00]*yf,n10=GX[g10]*(xf-1)+GY[g10]*yf,n01=GX[g01]*xf+GY[g01]*(yf-1),n11=GX[g11]*(xf-1)+GY[g11]*(yf-1);
  const x1=n00+u*(n10-n00),x2=n01+u*(n11-n01);return (x1+v*(x2-x1))*1.4;
}
// ---------------------------------------------------------------- terrain
const ROOF_IND=[[198,200,204],[172,182,192],[120,140,165],[182,172,160],[150,162,150],[205,205,200],[140,120,110]];
const CS=1/30000;
function baseH(x,y,oct){
  let px=x*CS,py=y*CS;
  const qx=noise(px*1.3+5.2,py*1.3+1.3),qy=noise(px*1.3-3.1,py*1.3+7.7);
  let e=0,a=0.62,fx=px+qx*0.6,fy=py+qy*0.6,ux=px,uy=py;
  for(let o=0;o<oct;o++){const w=o<2?1:o<4?0.5:0;const sx=fx*w+ux*(1-w),sy=fy*w+uy*(1-w);e+=a*noise(sx+o*31.7,sy-o*17.3);
    let nx=1.6*fx+1.2*fy;fy=-1.2*fx+1.6*fy;fx=nx;nx=1.6*ux+1.2*uy;uy=-1.2*ux+1.6*uy;ux=nx;a*=o<3?0.5:0.45}
  const dx=x/WORLD-0.5,dy=y/WORLD-0.5,d=M.sqrt(dx*dx+dy*dy)*2;
  e+=0.22-M.max(0,d-0.7)*2.6;
  const mm=smooth(0.2,0.5,e)*smooth(0.0,0.4,noise(x/42000+91.3,y/42000+12.1));
  if(mm>0){let fx=x/9000+40.5,fy=y/9000-20.2,amp=0.5,sum=0,prev=1;const no=M.min(oct+1,10);
    for(let o=0;o<no;o++){let r=1-M.abs(noise(fx,fy));r=r*M.sqrt(r);sum+=r*amp*prev;prev=clamp(r*1.5,0,1);const nx=1.62*fx+1.18*fy+3.7;fy=-1.18*fx+1.62*fy+1.9;fx=nx;amp*=0.48}
    e+=mm*sum*0.55}
  return e;
}
function riverV(x,y){
  let px=x/16000,py=y/16000;
  const wx=noise(px*1.9+70.1,py*1.9+3.3),wy=noise(px*1.9+13.7,py*1.9+80.9);
  px+=wx*0.5;py+=wy*0.5;
  return noise(px+200.3,py+50.7)+0.22*noise(px*3.1+7.7,py*3.1+3.3);
}
function riverW(x,y,e){
  if(e<-0.03)return 0;
  const big=smooth(-0.45,0.45,noise(x/55000+33.3,y/55000+44.4));
  return (0.0032+0.0105*big)*smooth(0.55,0.3,e);
}
function moist(x,y){return noise(x/22000+5.5,y/22000-8.8)*0.7+noise(x/6000+1.1,y/6000+2.2)*0.3}
function landE(x,y,mg){const e=baseH(x,y,7);if(e<0.004)return -1;const w=riverW(x,y,e);if(w>0){if(M.abs(riverV(x,y))<w+mg)return -1}return e}

// ---------------------------------------------------------------- names
const ROOTS=['Камен','Сосн','Берёз','Озёр','Яр','Зелен','Светл','Лес','Гор','Реч','Дуб','Лип','Орл','Сокол','Медвед','Журавл','Ольх','Кедр','Вишн','Снеж','Тих','Быстр','Ясн','Ржан','Север','Золот','Серебр','Волж','Камыш','Кузнец','Стальн','Мирн','Луч','Рад','Сибир','Урал','Ангар','Белг','Ковр','Иртыш','Добр','Звёзд','Свят','Лаз','Глин','Ключ','Рыбн','Холм','Бор','Студён'];
const PREF=['Ново','Старо','Верхне','Нижне','Усть-','Красно','Бело','Соль-'];
const EC=['инск','огорск','оград','ополь','одар','ов','оярск','озёрск','ово','ецк','ейск','ино'];
const EV=['овка','ино','ево','ское','енка','ки','ицы','ово','ье','иха','очное','ный'];
function mkName(R,t){let root=ROOTS[R()*ROOTS.length|0];let pre='';
  if(R()<0.33){pre=PREF[R()*PREF.length|0];if(!pre.endsWith('-'))root=root.toLowerCase()}
  const end=t>=1?EC[R()*EC.length|0]:EV[R()*EV.length|0];return pre+root+end}

// ---------------------------------------------------------------- spatial grids
const GC=4096,GNC=WORLD/GC,gridF=[];for(let i=0;i<GNC*GNC;i++)gridF.push([]);
function addF(o,x0,y0,x1,y1){const a=clamp(M.floor(x0/GC),0,GNC-1),b=clamp(M.floor(x1/GC),0,GNC-1),c=clamp(M.floor(y0/GC),0,GNC-1),d=clamp(M.floor(y1/GC),0,GNC-1);
  for(let j=c;j<=d;j++)for(let i=a;i<=b;i++)gridF[j*GNC+i].push(o)}
let stampF=1;
function queryF(x0,y0,x1,y1){stampF++;const out=[];const a=clamp(M.floor(x0/GC),0,GNC-1),b=clamp(M.floor(x1/GC),0,GNC-1),c=clamp(M.floor(y0/GC),0,GNC-1),d=clamp(M.floor(y1/GC),0,GNC-1);
  for(let j=c;j<=d;j++)for(let i=a;i<=b;i++){const L=gridF[j*GNC+i];for(let k=0;k<L.length;k++){const o=L[k];if(o._s===stampF)continue;o._s=stampF;
    if(o.bb[2]<x0||o.bb[0]>x1||o.bb[3]<y0||o.bb[1]>y1)continue;out.push(o)}}return out}
const RC=1024,RNC=WORLD/RC,gridR=[];for(let i=0;i<RNC*RNC;i++)gridR.push(null);
const roads=[];
function mkRoad(k,pts,extra){
  const n=pts.length/2;if(n<2)return null;
  const cum=new Float64Array(n);let L=0;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=0;i<n;i++){const x=pts[i*2],y=pts[i*2+1];if(i>0)L+=M.hypot(x-pts[i*2-2],y-pts[i*2-1]);cum[i]=L;
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(L<20)return null;
  const r={id:roads.length,k,pts:new Float64Array(pts),cum,L,n,bb:[x0,y0,x1,y1],br:null,_s:0};
  if(extra)Object.assign(r,extra);
  roads.push(r);
  for(let i=0;i<n-1;i++){const ax=pts[i*2],ay=pts[i*2+1],bx=pts[i*2+2],by=pts[i*2+3];
    const a=clamp(M.floor(M.min(ax,bx)/RC-0.05),0,RNC-1),b=clamp(M.floor(M.max(ax,bx)/RC+0.05),0,RNC-1),c=clamp(M.floor(M.min(ay,by)/RC-0.05),0,RNC-1),d=clamp(M.floor(M.max(ay,by)/RC+0.05),0,RNC-1);
    for(let j=c;j<=d;j++)for(let q=a;q<=b;q++){const id=j*RNC+q;let A=gridR[id];if(!A)A=gridR[id]=[];if(A[A.length-1]!==r.id)A.push(r.id)}}
  return r;
}
let stampR=1;
function queryRoads(x0,y0,x1,y1){stampR++;const out=[];const a=clamp(M.floor(x0/RC),0,RNC-1),b=clamp(M.floor(x1/RC),0,RNC-1),c=clamp(M.floor(y0/RC),0,RNC-1),d=clamp(M.floor(y1/RC),0,RNC-1);
  for(let j=c;j<=d;j++)for(let i=a;i<=b;i++){const A=gridR[j*RNC+i];if(!A)continue;for(let k=0;k<A.length;k++){const r=roads[A[k]];if(r._s===stampR)continue;r._s=stampR;
    if(r.bb[2]<x0-40||r.bb[0]>x1+40||r.bb[3]<y0-40||r.bb[1]>y1+40)continue;out.push(r)}}return out}
function bridgesOf(r){ // water intervals along road
  const out=[];let inW=false,s0=0;const step=24;
  for(let s=0;s<=r.L;s+=step){const p=posAt(r,s);const w=landE(p[0],p[1],0)<0;
    if(w&&!inW){inW=true;s0=s}else if(!w&&inW){inW=false;out.push([M.max(0,s0-28),M.min(r.L,s+4)])}}
  if(inW)out.push([M.max(0,s0-28),r.L]);r.br=out.length?out:null}
const _p=[0,0,0,0];
function posAt(r,s){const c=r.cum;let lo=0,hi=r.n-1;if(s<=0)s=0;if(s>=r.L)s=r.L-1e-6;
  while(hi-lo>1){const m=(lo+hi)>>1;if(c[m]>s)hi=m;else lo=m}
  const t=(s-c[lo])/(c[hi]-c[lo]||1);const ax=r.pts[lo*2],ay=r.pts[lo*2+1],bx=r.pts[hi*2],by=r.pts[hi*2+1];
  const dx=bx-ax,dy=by-ay,l=M.hypot(dx,dy)||1;_p[0]=ax+dx*t;_p[1]=ay+dy*t;_p[2]=dx/l;_p[3]=dy/l;return _p}
function waterRunOK(pts,maxRun,maxFrac){let run=0,wl=0,L=0;
  for(let i=0;i<pts.length/2-1;i++){const ax=pts[i*2],ay=pts[i*2+1],bx=pts[i*2+2],by=pts[i*2+3];const l=M.hypot(bx-ax,by-ay);const n=M.max(1,M.ceil(l/60));
    for(let k=0;k<n;k++){const t=k/n;const w=landE(ax+(bx-ax)*t,ay+(by-ay)*t,0)<0;const d=l/n;L+=d;if(w){run+=d;wl+=d;if(run>maxRun)return false}else run=0}}
  return wl<=L*maxFrac}

// ---------------------------------------------------------------- settlements
const cities=[];
function cityF(c,x,y){const dx=x-c.x,dy=y-c.y;return M.sqrt(dx*dx+dy*dy)/c.R+0.26*noise(x/(c.R*0.9)+c.id*7.13,y/(c.R*0.9)-c.id*3.7)}
{
  const CELL=2700,NC=M.floor(WORLD/CELL);const cand=[];
  for(let cy=0;cy<NC;cy++)for(let cx=0;cx<NC;cx++){const R=rng(hh(cx,cy,11));if(R()<0.12)continue;
    const x=(cx+0.15+0.7*R())*CELL,y=(cy+0.15+0.7*R())*CELL;const e=landE(x,y,0.006);if(e<0.022||e>0.34)continue;
    const t=R();let type,Rr;
    if(t<0.022){type=3;Rr=2500+R()*1200}else if(t<0.08){type=2;Rr=1150+R()*700}else if(t<0.24){type=1;Rr=520+R()*380}else{type=0;Rr=170+R()*190}
    cand.push({x,y,R:Rr,type,seed:hh(cx,cy,12)})}
  cand.sort((a,b)=>b.type-a.type||b.R-a.R);
  for(const c of cand){let ok=true;for(const k of cities){const d=M.hypot(c.x-k.x,c.y-k.y);if(d<(c.R+k.R)*1.12+(c.type+k.type>1?900:250)){ok=false;break}}if(ok)cities.push(c)}
  cities.forEach((c,i)=>{c.id=i;const R=rng(c.seed^0x777);c.name=mkName(R,c.type);c.bb=[c.x-c.R*1.4,c.y-c.R*1.4,c.x+c.R*1.4,c.y+c.R*1.4];c.kind='city'});
}
function buildCity(c){
  const R=rng(c.seed^0x55);c.ang=R()*PI;c.ca=M.cos(c.ang);c.sa=M.sin(c.ang);
  if(c.type===3){c.bu=140+R()*40;c.bv=110+R()*30}else if(c.type===2){c.bu=118+R()*30;c.bv=95+R()*25}else{c.bu=92+R()*25;c.bv=78+R()*20}
  const N=c.N=M.ceil(c.R*1.3/M.min(c.bu,c.bv)),D=c.D=2*N+1;const ok=new Uint8Array(D*D);
  const us=c.us=new Float64Array(D),vs=c.vs=new Float64Array(D);for(let k=1;k<=N;k++){us[N+k]=us[N+k-1]+c.bu*(0.7+0.6*R());us[N-k]=us[N-k+1]-c.bu*(0.7+0.6*R());vs[N+k]=vs[N+k-1]+c.bv*(0.7+0.6*R());vs[N-k]=vs[N-k+1]-c.bv*(0.7+0.6*R())}
  for(let j=0;j<D;j++)for(let i=0;i<D;i++){const u=us[i],v=vs[j];const x=c.x+u*c.ca-v*c.sa,y=c.y+u*c.sa+v*c.ca;
    if(cityF(c,x,y)<1){const e=landE(x,y,0.0025);if(e>=0&&e<0.42)ok[j*D+i]=1}}
  const BD=D-1;const bl=c.blocks=new Uint8Array(BD*BD);let stad=false,cnt=0;
  for(let j=0;j<BD;j++)for(let i=0;i<BD;i++){if(!(ok[j*D+i]&&ok[j*D+i+1]&&ok[(j+1)*D+i]&&ok[(j+1)*D+i+1]))continue;
    const u=(us[i]+us[i+1])/2,v=(vs[j]+vs[j+1])/2;const x=c.x+u*c.ca-v*c.sa,y=c.y+u*c.sa+v*c.ca;
    const Rb=rng(hh(c.id,i*977+j,51));let t=pickType(c,cityF(c,x,y),Rb);if(t===9){if(stad)t=5;else stad=true}bl[j*BD+i]=t;cnt++}
  c.nblocks=cnt;
  const blk=(i,j)=>i>=0&&j>=0&&i<BD&&j<BD&&bl[j*BD+i]>0;
  // streets along U (fixed j)
  for(let j=0;j<D;j++){let s=-1;for(let i=0;i<=D;i++){const e=i<D-1&&ok[j*D+i]&&ok[j*D+i+1]&&(blk(i,j-1)||blk(i,j));

          if(X<-30||Y<-30||X>VW+30||Y>VH+30)continue;carCount++;
          const ty=(hq>>>12)&31;const truck=(r.k===0&&(li%3===2?ty<18:ty<3))||(r.k===1&&ty<5);const bus=!truck&&r.k===2&&ty<2;
          if(dots){const c=W.sprites().car;ctx.fillStyle=truck?'#ddd':bus?'#e8c040':['#eee','#ccc','#333','#a22','#36c','#888','#454','#eb3'][(hq>>>17)&7];const sz=M.max(1.2,(truck?9:4.5)*k);ctx.fillRect(X-sz/2,Y-sz/2,sz,sz);continue}
          setRot(X,Y,hx,hy,k);
          if(truck){ctx.drawImage(S.truck[(hq>>>17)%5],-8.5,-2.1,17,4.25)}else if(bus){ctx.drawImage(S.bus,-6.25,-1.5,12.5,3)}else ctx.drawImage(S.car[(hq>>>17)%S.car.length],-2.5,-1.25,5,2.5)}}}}}
function drawTrains(roads){const m=cam.m,k=1/m;
  for(const r of roads){if(r.k!==5)continue;const nt=M.max(1,M.round(r.L/14000));
    for(let q=0;q<nt;q++){const h=hsh(r.id,q,21),nw=8+(h*16|0),len=nw*25.5,span=r.L-len-40;if(span<200)continue;const v=20+h*14;const pax=hsh(r.id,q,23)<0.4;
      const u=(T*v+hsh(r.id,q,22)*span*2)%(2*span);const fw=u<span;const tail=20+(fw?u:2*span-u);
      const pm=W.posAt(r,tail+len/2);if(!inView(pm[0],pm[1],len))continue;
      for(let w=0;w<nw;w++){const s=tail+(w+0.5)*25.5;const p=W.posAt(r,s);const X=sxw(p[0]),Y=syw(p[1]);if(X<-40||Y<-40||X>VW+40||Y>VH+40)continue;
        const loco=fw?w===nw-1:w===0;setRot(X,Y,p[2],p[3],k);
        ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(-12+1.2,-1.6+1,24.4,3.3);
        let c;if(loco)c=pax?'#b8322a':'#2c6a3c';else if(pax)c='#3e7a5a';else{const t=(hsh(r.id,q*100+w,24)*4)|0;c=['#2a2a2c','#7a4a32','#8a8a8a','#3a5a8a'][t]}
        ctx.fillStyle=c;ctx.fillRect(-12,-1.6,24,3.25);
        if(k>2){if(pax&&!loco){ctx.fillStyle='rgba(220,230,220,0.5)';ctx.fillRect(-11,-1.6,22,0.5)}else if(!loco&&c==='#2a2a2c'){ctx.fillStyle='#555';ctx.fillRect(-10,-0.9,20,1.8)}
          else if(loco){ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(-10,-1.2,18,2.4);ctx.fillStyle='#223';ctx.fillRect(fw?10:-12,-1.4,2,2.8)}}}}}}
function drawShips(){const m=cam.m,k=1/m;if(m>30)return;
  for(const sh of W.ships){const span=sh.L;const u=(T*sh.v+sh.ph)%(2*span);const fw=u<span,s=fw?u:2*span-u;const dx=(sh.bx-sh.ax)/span,dy=(sh.by-sh.ay)/span;
    const x=sh.ax+dx*s,y=sh.ay+dy*s;if(!inView(x,y,sh.len*3))continue;const hx=fw?dx:-dx,hy=fw?dy:-dy;const X=sxw(x),Y=syw(y);setRot(X,Y,hx,hy,k);
    const L=sh.len;const g=ctx.createLinearGradient(-L/2,0,-L*3.2,0);g.addColorStop(0,'rgba(240,250,255,0.55)');g.addColorStop(1,'rgba(240,250,255,0)');ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(-L*0.45,-L*0.06);ctx.lineTo(-L*3.2,-L*0.5);ctx.lineTo(-L*3.2,-L*0.38);ctx.lineTo(-L*0.5,0);ctx.lineTo(-L*3.2,L*0.38);ctx.lineTo(-L*3.2,L*0.5);ctx.lineTo(-L*0.45,L*0.06);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.moveTo(L*0.5,0);ctx.lineTo(L*0.3,-L*0.12);ctx.lineTo(L*0.3,L*0.12);ctx.fill();
    W.drawShip(ctx,L,sh.st,sh.c)}}
function drawEmitters(){const m=cam.m;if(m>28)return;ctx.setTransform(DPR,0,0,DPR,0,0);const k=1/m;const px=-W.WDY,py=W.WDX;
  for(const e of W.emitters){if(!inView(e.x,e.y,e.k==='steam'?1500:700))continue;
    if(e.k==='flare'){const X=sxw(e.x),Y=syw(e.y);ctx.globalCompositeOperation='lighter';const f=1+0.25*M.sin(T*13+e.ph*50)+0.15*M.sin(T*31+e.ph*9);const sz=M.max(4,26*f*k);
      ctx.globalAlpha=0.85;ctx.drawImage(FLAME,X-sz/2+3*k,Y-sz/2-2*k,sz,sz);ctx.globalAlpha=0.9;const s2=sz*0.45;ctx.drawImage(FLAME2,X-s2/2,Y-s2/2,s2,s2);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}
    const n=e.k==='steam'?16:e.k==='flare'?6:18,rate=e.k==='steam'?0.035:0.055,len=(e.k==='steam'?650:420)*e.s;
    for(let i=0;i<n;i++){const age=((T*rate+i/n+e.ph)%1);const wob=M.sin(age*5+e.ph*20+i)*age*40;
      const x=e.x+W.WDX*age*len+px*wob,y=e.y+W.WDY*age*len+py*wob;const X=sxw(x),Y=syw(y);
      let r,a,spr;if(e.k==='steam'){r=(30+age*150)*e.s;a=0.8*M.pow(1-age,1.2)*M.min(1,age*10+0.3);spr=PUFF_W}else if(e.k==='flare'){r=6+age*30;a=0.25*(1-age);spr=PUFF_D}else{r=(6+age*50)*e.s;a=0.6*(1-age)*M.min(1,age*12+0.2);spr=PUFF_G}
      const sz=r*2*k;if(sz<1)continue;ctx.globalAlpha=a;ctx.drawImage(spr,X-sz/2,Y-sz/2,sz,sz)}}ctx.globalAlpha=1}
function drawTurbines(){const m=cam.m;if(m>12)return;const k=1/m;ctx.setTransform(DPR,0,0,DPR,0,0);const ux=-W.WDY,uy=W.WDX;
  for(const f of W.farms){if(!inView((f.bb[0]+f.bb[2])/2,(f.bb[1]+f.bb[3])/2,2600))continue;
    for(const t of f.t){if(!inView(t.x,t.y,150))continue;const th=T*t.sp+t.ph;const hx=t.x+W.SUNX*95,hy=t.y+W.SUNY*95;
      ctx.lineCap='round';ctx.strokeStyle='rgba(10,20,30,0.32)';ctx.lineWidth=M.max(1,2.4*k);ctx.beginPath();
      for(let b=0;b<3;b++){const a=th+b*TAU/3;const c=M.cos(a)*55,s=M.sin(a)*55;ctx.moveTo(sxw(hx),syw(hy));ctx.lineTo(sxw(hx+ux*c+W.SUNX*s),syw(hy+uy*c+W.SUNY*s))}ctx.stroke();
      ctx.strokeStyle='#f2f2f0';ctx.lineWidth=M.max(1,2.2*k);ctx.beginPath();const X=sxw(t.x),Y=syw(t.y);
      for(let b=0;b<3;b++){const a=th+b*TAU/3;const c=M.cos(a)*55;ctx.moveTo(X,Y);ctx.lineTo(sxw(t.x+ux*c-W.WDX*2),syw(t.y+uy*c-W.WDY*2))}ctx.stroke();
      ctx.fillStyle='#dcdcd8';ctx.save();ctx.translate(X,Y);ctx.rotate(M.atan2(W.WDY,W.WDX));ctx.fillRect(-2*k,-1.6*k,9*k,3.2*k);ctx.restore()}}ctx.lineCap='butt'}
function camH(){return cam.m*VH*0.9}
function drawFlights(){const H=camH();ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const f of W.flights){const tot=f.L+(f.kind?0:900*f.v/78);const s=(T*f.v+f.ph)%tot;if(s>f.L)continue;
    let i=1;while(i<f.n-1&&f.cum[i]<s)i++;const t=(s-f.cum[i-1])/(f.cum[i]-f.cum[i-1]||1);const ax=f.pts[i*2-2],ay=f.pts[i*2-1],bx=f.pts[i*2],by=f.pts[i*2+1];
    const x=ax+(bx-ax)*t,y=ay+(by-ay)*t;let hx=bx-ax,hy=by-ay;const hl=M.hypot(hx,hy)||1;hx/=hl;hy/=hl;
    let alt=f.alt;if(!f.kind){const td=f.cum[4]+300;alt=clamp(M.min((s-1900)*0.11,(td-s)*0.055),0,f.alt)}
    const sx=x+W.SUNX*alt,sy=y+W.SUNY*alt;
    if(inView(sx,sy,200)&&cam.m<60){const X=sxw(sx),Y=syw(sy),sz=64/cam.m;if(sz>1.5){ctx.globalAlpha=0.28;ctx.save();ctx.translate(X,Y);ctx.rotate(M.atan2(hy,hx));ctx.drawImage(PLANESH[f.c],-sz/2,-sz/2,sz,sz);ctx.restore();ctx.globalAlpha=1}}
    if(alt>H*0.9)continue;const kk=H/(H-alt);const X=VW/2+(x-cam.x)/cam.m*kk,Y=VH/2+(y-cam.y)/cam.m*kk;if(X<-200||Y<-200||X>VW+200||Y>VH+200)continue;
    const sz=64/cam.m*kk*(f.kind?1.1:1);
    if(f.kind&&sz>0.3){const L=9000/cam.m*kk;const g=ctx.createLinearGradient(X,Y,X-hx*L,Y-hy*L);g.addColorStop(0,'rgba(255,255,255,0.75)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=g;ctx.lineWidth=M.max(1,14/cam.m*kk);
      ctx.beginPath();for(const o of [-1,1]){ctx.moveTo(X-hx*sz*0.3-hy*o*sz*0.12,Y-hy*sz*0.3+hx*o*sz*0.12);ctx.lineTo(X-hx*L-hy*o*sz*0.5,Y-hy*L+hx*o*sz*0.5)}ctx.stroke()}
    if(sz<2){if(sz>0.4){ctx.fillStyle='#fff';ctx.fillRect(X-1,Y-1,2,2)}continue}
    ctx.save();ctx.translate(X,Y);ctx.rotate(M.atan2(hy,hx));ctx.drawImage(PLANES[f.c],-sz/2,-sz/2,sz,sz);
    if(sz>10){const bl=(T*1.3+f.ph)%1<0.08;if(bl){ctx.fillStyle='rgba(255,60,60,0.95)';ctx.beginPath();ctx.arc(-sz*0.07,-sz*0.42,M.max(1.5,sz*0.02),0,TAU);ctx.fill();ctx.fillStyle='rgba(80,255,120,0.95)';ctx.beginPath();ctx.arc(-sz*0.07,sz*0.42,M.max(1.5,sz*0.02),0,TAU);ctx.fill()}}ctx.restore()}}
function drawClouds(shadowPass){const H=camH();ctx.setTransform(DPR,0,0,DPR,0,0);const span=WORLD*1.3;
  for(const c of clouds){let x=((c.x+T*9+WORLD*0.15)%span+span)%span-WORLD*0.15,y=c.y;
    if(shadowPass){if(cam.m<0.12)continue;const sx=x+W.SUNX*c.alt,sy=y+W.SUNY*c.alt;if(!inView(sx,sy,c.s))continue;const sz=c.s/cam.m;ctx.globalAlpha=0.2;ctx.drawImage(CLS[c.v][1],sxw(sx)-sz/2,syw(sy)-sz/2,sz,sz);continue}
    if(H<c.alt*1.12)continue;const kk=H/(H-c.alt);const a=smooth(c.alt*1.12,c.alt*2.6,H);if(a<=0.01)continue;
    const X=VW/2+(x-cam.x)/cam.m*kk,Y=VH/2+(y-cam.y)/cam.m*kk,sz=c.s/cam.m*kk;if(X+sz/2<0||Y+sz/2<0||X-sz/2>VW||Y-sz/2>VH)continue;
    ctx.globalAlpha=a*0.95;ctx.drawImage(CLS[c.v][0],X-sz/2,Y-sz/2,sz,sz)}ctx.globalAlpha=1}
const ZNAME={air:'Аэропорт',ref:'НПЗ',pow:'ТЭЦ',port:'Порт',ind:'Промзона',solar:'Солнечная электростанция'};
function drawLabels(){ctx.setTransform(DPR,0,0,DPR,0,0);const m=cam.m;const boxes=[];ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  const lim=[9,32,95,380],fs=[11,12.5,15,19];
  for(const c of W.cities){if(m>lim[c.type])continue;const X=sxw(c.x),Y=syw(c.y);if(X<-100||Y<-30||X>VW+100||Y>VH+30)continue;
    const a=M.min(1,(lim[c.type]-m)/(lim[c.type]*0.3))*(m<0.6?0.55:1);ctx.font=`${c.type>=2?600:500} ${fs[c.type]}px system-ui,Segoe UI,Roboto,sans-serif`;const w=ctx.measureText(c.name).width+8,h=fs[c.type]+4;
    let hit=false;for(const b of boxes){if(M.abs(b[0]-X)<(b[2]+w)/2&&M.abs(b[1]-Y)<(b[3]+h)/2){hit=true;break}}if(hit)continue;boxes.push([X,Y,w,h]);
    ctx.globalAlpha=a;ctx.strokeStyle='rgba(10,20,30,0.75)';ctx.lineWidth=3.5;ctx.strokeText(c.name,X,Y);ctx.fillStyle=c.type===3?'#fff6dc':'#ffffff';ctx.fillText(c.name,X,Y)}
  if(m<9){ctx.font='500 11px system-ui,sans-serif';for(const z of W.zones){const X=sxw(z.x),Y=syw(z.y);if(X<-80||Y<-20||X>VW+80||Y>VH+20)continue;const t=ZNAME[z.zk];ctx.globalAlpha=M.min(1,(9-m)/3)*0.9;
    ctx.strokeStyle='rgba(10,20,30,0.7)';ctx.lineWidth=3;ctx.strokeText(t,X,Y);ctx.fillStyle='#ffe9a8';ctx.fillText(t,X,Y)}}
  ctx.globalAlpha=1}

// ------------------------------------------------------------ main loop
let last=performance.now(),fpsA=60,hudT=0,zNow=0;
const hud={alt:document.getElementById('alt'),scale:document.getElementById('scalebar'),scaleT:document.getElementById('scalet'),pos:document.getElementById('pos'),fps:document.getElementById('fps'),load:document.getElementById('loading')};
const mini=document.getElementById('mini'),mctx=mini.getContext('2d');
function frame(now){const dt=M.min(0.06,(now-last)/1000);last=now;T+=dt;frameNo++;fpsA=fpsA*0.95+(1/M.max(dt,1e-3))*0.05;
  updateCam(dt);
  vx0=cam.x-VW/2*cam.m;vy0=cam.y-VH/2*cam.m;vx1=cam.x+VW/2*cam.m;vy1=cam.y+VH/2*cam.m;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#0e2e52';ctx.fillRect(0,0,VW,VH);
  // animated water glints (seen through translucent water in tiles)
  const P=M.max(cam.m,0.3),sc=P/cam.m;
  for(let l=0;l<2;l++){const dr=l?-1:1;const ox=VW/2-cam.x/cam.m+T*(l?3:5)*dr/cam.m*sc,oy=VH/2-cam.y/cam.m+T*(l?4:-2)/cam.m*sc;
    wavePat.setTransform(new DOMMatrix([sc*(l?1.37:1),0,0,sc*(l?1.37:1),ox+l*77,oy+l*31]));ctx.fillStyle=wavePat;ctx.globalAlpha=(l?0.5:0.7)*(1-smooth(4,60,cam.m)*0.75);ctx.fillRect(0,0,VW,VH)}ctx.globalAlpha=1;
  zNow=drawTiles();
  {ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(14,46,82,0.8)';const X0=sxw(0),Y0=syw(0),X1=sxw(WORLD),Y1=syw(WORLD);ctx.beginPath();ctx.rect(-5,-5,VW+10,VH+10);ctx.rect(X0,Y0,X1-X0,Y1-Y0);ctx.fill('evenodd')}
  if(opt.clouds)drawClouds(true);
  if(opt.traffic&&cam.m<30){const rs=cam.m<8?W.queryRoads(vx0,vy0,vx1,vy1):[];if(cam.m<3.2)drawTraffic(rs);if(cam.m<8)drawTrains(rs);drawShips()}
  drawEmitters();drawTurbines();
  if(opt.traffic)drawFlights();
  if(opt.clouds)drawClouds(false);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const hz=smooth(40,600,cam.m)*0.16;if(hz>0){ctx.fillStyle=`rgba(160,195,230,${hz})`;ctx.fillRect(0,0,VW,VH)}
  ctx.fillStyle=vign;ctx.fillRect(0,0,VW,VH);
  if(opt.labels)drawLabels();
  if(frameNo%30===0)evict();
  hudT+=dt;if(hudT>0.12){hudT=0;updHUD()}
  requestAnimationFrame(frame)}
function fmtD(m){return m>=1000?(m/1000).toFixed(m>=10000?0:1).replace('.',',')+' км':M.round(m)+' м'}
function updHUD(){const H=camH();hud.alt.textContent=fmtD(H);
  const target=110*cam.m;const p=M.pow(10,M.floor(M.log10(target)));let L=p;for(const f of [1,2,5,10])if(f*p<=target)L=f*p;hud.scale.style.width=(L/cam.m)+'px';hud.scaleT.textContent=fmtD(L);
  hud.pos.textContent=`${(cam.x/1000).toFixed(2)} : ${(cam.y/1000).toFixed(2)} км · LOD ${zNow}`;hud.fps.textContent=`${M.round(fpsA)} FPS · тайлов ${cache.size}${mainRender?' (CPU)':' · потоков '+workers.filter(w=>w.ready).length}${carCount?' · машин '+carCount:''}`;
  const z0=cache.get(0);if(z0){if(hud.load.style.display!=='none'&&cache.size>4)hud.load.style.display='none';
    mctx.setTransform(1,0,0,1,0,0);mctx.drawImage(z0.b,0,0,mini.width,mini.height);const s=mini.width/WORLD;mctx.strokeStyle='#ffd25a';mctx.lineWidth=1.5;
    const w=M.max(3,(vx1-vx0)*s),h=M.max(3,(vy1-vy0)*s);mctx.strokeRect(cam.x*s-w/2,cam.y*s-h/2,w,h)}}
mini.addEventListener('click',e=>{const r=mini.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*WORLD,y=(e.clientY-r.top)/r.height*WORLD;flyTo(x,y,M.min(cam.m,40))});

// ------------------------------------------------------------ UI
const list=document.getElementById('list'),q=document.getElementById('q');
const TN=['Деревня','Город','Крупный город','Мегаполис'];
const sorted=W.cities.slice().sort((a,b)=>b.type-a.type||a.name.localeCompare(b.name,'ru'));
function fill(){const f=q.value.trim().toLowerCase();list.innerHTML='';let n=0;
  for(const c of sorted){if(f?c.name.toLowerCase().indexOf(f)<0:c.type<1)continue;if(++n>80)break;const d=document.createElement('div');d.className='it t'+c.type;d.innerHTML=`<b>${c.name}</b><span>${TN[c.type]}</span>`;
    d.onclick=()=>flyTo(c.x,c.y,c.type===3?2.2:c.type===2?1.4:c.type===1?0.9:0.45);list.appendChild(d)}}
q.addEventListener('input',fill);fill();
document.getElementById('st').textContent=`${W.cities.length} населённых пунктов · ${W.zones.length} пром. объектов · ${M.round(W.roads.reduce((a,r)=>a+r.L,0)/1000)} км дорог · ${(WORLD/1000).toFixed(0)}×${(WORLD/1000).toFixed(0)} км`;
for(const id of ['clouds','labels','traffic']){const el=document.getElementById('o_'+id);el.checked=opt[id];el.onchange=()=>opt[id]=el.checked}
document.getElementById('newworld').onclick=()=>{location.hash=String((M.random()*1e9)|0);location.reload()};
document.getElementById('seed').textContent='seed '+SEED;
document.getElementById('rnd').onclick=()=>{const c=W.cities[(M.random()*W.cities.length)|0];flyTo(c.x+(M.random()-0.5)*c.R,c.y+(M.random()-0.5)*c.R,0.35+M.random()*1.5)};
document.getElementById('home').onclick=()=>flyTo(WORLD/2,WORLD/2,maxM()*0.95);
document.getElementById('tg').onclick=()=>document.getElementById('side').classList.toggle('hid');
let introOff=false;window.__world={W,cam,flyTo,cache,opt,stop:()=>{introOff=true;fly=null;zoomT=null}};
requestAnimationFrame(frame);
// cinematic intro: dive from orbit to the largest city
const big=W.cities.find(c=>c.type===3)||W.cities[0];
setTimeout(()=>{if(!drag&&!zoomT&&!introOff)flyTo(big.x+big.R*0.12,big.y+big.R*0.08,2.4,7)},1600);
})();
